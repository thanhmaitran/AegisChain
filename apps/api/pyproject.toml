[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegischain-api"
version = "0.1.0"
description = "REST API for AegisChain"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aegischain[api]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
