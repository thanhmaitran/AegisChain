name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pip-audit
      - run: pip-audit -r <(python -c "import tomllib;d=tomllib.load(open('pyproject.toml','rb'))['project'];print('\n'.join(d['dependencies']+d['optional-dependencies']['api']))")

  dogfood:
    # AegisChain analyses its own repository's manifests with the strict production policy
    # in report-only mode; the SBOM and report are kept as build evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e .
      - run: python -m aegischain analyze apps/web --osv-cache .osv-cache --out artifacts --policy configs/policies/default.yaml || echo "decision exit code $?"
      - uses: actions/upload-artifact@v4
        with: { name: self-analysis, path: artifacts }

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix: { language: [python, javascript-typescript] }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
