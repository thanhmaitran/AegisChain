[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegischain"
version = "0.1.0"
description = "Software Supply Chain Security and Provenance Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AegisChain contributors" }]
keywords = ["sbom", "supply-chain", "slsa", "sigstore", "osv", "security"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]

# The core engines deliberately depend only on small, widely audited libraries.
dependencies = [
    "networkx>=3.4",
    "packaging>=24.1",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]
security = ["sigstore>=3.0"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=4.0",
]

[project.scripts]
aegischain = "aegischain.cli:main"

[tool.setuptools]
package-dir = { "" = "packages/aegischain-core/src" }

[tool.setuptools.packages.find]
where = ["packages/aegischain-core/src"]

[tool.setuptools.package-data]
aegischain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
pythonpath = [".", "packages/aegischain-core/src", "apps/api/src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["packages/aegischain-core/src/aegischain", "apps/api/src/aegischain_api"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    "UP042", # Preserve str, Enum behavior.
]

[tool.ruff.lint.per-file-ignores]
"apps/api/**" = ["B008"]  # FastAPI's Depends()/Path()/Query() in defaults is idiomatic
"database/migrations/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/aegischain-core/src:apps/api/src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["networkx.*", "yaml.*", "sigstore.*", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
